# Minimal checks pulled forward from BE-011 (full CI and architecture checks land there).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pcntl, pdo_sqlite
          coverage: none
          tools: composer:v2

      # Until composer.lock is committed this resolves fresh dependencies (`composer update`).
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Upload resolved composer.lock
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock

      # Same as `make setup`: Larastan boots the app, and with no .env APP_ENV defaults to
      # production, where config validation (correctly) requires APP_KEY.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Formatting (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest, parallel)
        run: php artisan test --parallel
