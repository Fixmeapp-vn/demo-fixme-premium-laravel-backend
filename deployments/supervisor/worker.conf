[program:queue-worker]
command=php /var/www/html/artisan platform:worker
autostart=true
autorestart=true
; SIGTERM lets the in-flight job finish (bounded by QUEUE_JOB_TIMEOUT); supervisor
; waits SHUTDOWN_TIMEOUT before SIGKILL. The app refuses to boot unless
; SHUTDOWN_TIMEOUT > QUEUE_JOB_TIMEOUT.
stopsignal=TERM
stopwaitsecs=%(ENV_SHUTDOWN_TIMEOUT)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
