[program:queue-worker]
command=php /var/www/html/artisan platform:worker
autostart=true
autorestart=true
; SIGTERM lets the in-flight job finish; stopwaitsecs must exceed SHUTDOWN_TIMEOUT (default 30s).
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
