[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Hard stop for a request that ignores max_execution_time (e.g. stuck in I/O).
; Keep it above HTTP_REQUEST_TIMEOUT (default 30s).
request_terminate_timeout = 40s

; Send worker stdout/stderr (JSON logs) to the FPM log stream.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
