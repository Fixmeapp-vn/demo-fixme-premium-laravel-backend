[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Wall-clock request limit. PHP's own max_execution_time (set per request from
; HTTP_REQUEST_TIMEOUT by EnforceRequestTimeout) only counts CPU time on Linux,
; so time spent waiting on I/O (DB, HTTP calls, sleep) is bounded only here.
; PHP-FPM expands ${VAR} from the process environment.
request_terminate_timeout = ${HTTP_REQUEST_TIMEOUT}s

; Send worker stdout/stderr (JSON logs) to the FPM log stream.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
